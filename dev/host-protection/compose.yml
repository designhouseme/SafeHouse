# Test-only resource limits. Never copy these values into a production hosting profile.
services:
  php:
    image: php:8.3-fpm-bookworm
    user: '33:33'
    read_only: true
    cpus: 1.0
    mem_limit: 256m
    memswap_limit: 256m
    pids_limit: 32
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      SHOUSE_HOST_PROTECTION_LAB: '1'
    volumes:
      - .:/fixtures:ro
      - ./fpm.conf:/usr/local/etc/php-fpm.d/zz-host-protection.conf:ro
    tmpfs:
      - /tmp:size=16m,mode=1777
    healthcheck:
      test: [CMD, php, -r, 'exit(@fsockopen("127.0.0.1", 9000) ? 0 : 1);']
      interval: 1s
      timeout: 2s
      retries: 15
  nginx:
    image: nginx:stable-alpine
    user: '101:101'
    entrypoint: [nginx, -g, 'daemon off;']
    read_only: true
    cpus: 0.25
    mem_limit: 64m
    memswap_limit: 64m
    pids_limit: 16
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    tmpfs:
      - /tmp:size=8m,mode=1777
    depends_on:
      php:
        condition: service_healthy
networks:
  default:
    internal: true
