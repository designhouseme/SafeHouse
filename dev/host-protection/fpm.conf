; Deliberately short, test-only deadlines. This is not a production configuration template.
[global]
error_log = /tmp/shouse-fpm-error.log
log_level = notice

[www]
listen = 9000
pm = static
pm.max_children = 2
pm.max_requests = 0
request_terminate_timeout = 3s
request_terminate_timeout_track_finished = yes
request_slowlog_timeout = 0
clear_env = yes
env[SHOUSE_HOST_PROTECTION_LAB] = 1
catch_workers_output = yes
decorate_workers_output = no
php_admin_value[memory_limit] = 24M
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /proc/self/fd/2
