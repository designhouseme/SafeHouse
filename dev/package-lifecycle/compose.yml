# The plugin is installed into this writable WordPress volume from a real ZIP.
# Only lifecycle fixtures and the temporary artifact directory are bind mounted.
x-wp-env: &wp-env
  WORDPRESS_DB_HOST: db
  WORDPRESS_DB_NAME: lifecycle
  WORDPRESS_DB_USER: lifecycle
  WORDPRESS_DB_PASSWORD: ${SHOUSE_PACKAGE_DB_PASSWORD:?Run dev/package-lifecycle-test.sh}
  WORDPRESS_DEBUG: '1'
  WORDPRESS_CONFIG_EXTRA: |
    define( 'WP_ENVIRONMENT_TYPE', 'local' );
    define( 'DISABLE_WP_CRON', true );
    define( 'SHOUSE_DISABLE_UPDATES', true );
    define( 'WP_HTTP_BLOCK_EXTERNAL', true );
    define( 'WP_DEBUG_LOG', true );
    define( 'WP_DEBUG_DISPLAY', false );
    define( 'SHOUSE_PACKAGE_LIFECYCLE_FIXTURE', true );
    define( 'SHOUSE_MODULES', [ 'watch' => false, 'tweaks' => true ] );
    define( 'SHOUSE_LOCK_SETTINGS', true );
services:
  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: lifecycle
      MARIADB_USER: lifecycle
      MARIADB_PASSWORD: ${SHOUSE_PACKAGE_DB_PASSWORD:?Run dev/package-lifecycle-test.sh}
      MARIADB_ROOT_PASSWORD: ${SHOUSE_PACKAGE_DB_ROOT_PASSWORD:?Run dev/package-lifecycle-test.sh}
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - database:/var/lib/mysql
  wordpress:
    image: ${SHOUSE_PACKAGE_WP_IMAGE:-wordpress:php8.3-apache}
    depends_on:
      db:
        condition: service_healthy
    environment: *wp-env
    volumes:
      - wordpress:/var/www/html
      - ./mu-plugins:/var/www/html/wp-content/mu-plugins:ro
  cli:
    image: ${SHOUSE_PACKAGE_CLI_IMAGE:-wordpress:cli-php8.3}
    user: '33:33'
    profiles: [cli]
    environment: *wp-env
    volumes:
      - wordpress:/var/www/html
      - ./mu-plugins:/var/www/html/wp-content/mu-plugins:ro
      - ${SHOUSE_PACKAGE_ARTIFACTS:?Run dev/package-lifecycle-test.sh}:/packages:ro
      - ../security/package-lifecycle-test.php:/tests/security/package-lifecycle-test.php:ro
networks:
  default:
    internal: true
volumes:
  database:
  wordpress:
