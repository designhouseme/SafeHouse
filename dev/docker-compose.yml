name: shouse-dev

# Local test site: WordPress + WooCommerce + Wordfence, with the plugin mounted from the repo.
# Every e-mail lands in Mailpit (http://localhost:8025); nothing is delivered for real.
x-wp-env: &wp-env
  WORDPRESS_DB_HOST: db:3306
  WORDPRESS_DB_USER: wordpress
  WORDPRESS_DB_PASSWORD: wordpress
  WORDPRESS_DB_NAME: wordpress
  WORDPRESS_DEBUG: "1"
  WORDPRESS_CONFIG_EXTRA: |
    define( 'WP_DEBUG_LOG', '/var/www/html/wp-content/debug.log' );
    define( 'WP_DEBUG_DISPLAY', false );
    define( 'WP_ENVIRONMENT_TYPE', 'local' );
    define( 'SHOUSE_SMTP_HOST', 'mailpit' );
    define( 'SHOUSE_SMTP_PORT', 1025 );
    define( 'SHOUSE_SMTP_SECURE', '' );
    define( 'WP_REDIS_HOST', 'redis' );

services:
  redis:
    image: redis:7-alpine

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"

  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
      MARIADB_ROOT_PASSWORD: wordpress
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 30

  wordpress:
    image: ${WP_IMAGE:-wordpress:php8.3-apache}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${WP_PORT:-8894}:80"
    environment: *wp-env
    volumes:
      - wp_core:/var/www/html
      - ..:/var/www/html/wp-content/plugins/shouse

  wpcli:
    image: ${CLI_IMAGE:-wordpress:cli-php8.3}
    profiles: ["cli"]
    user: "33:33"
    depends_on:
      db:
        condition: service_healthy
    environment: *wp-env
    volumes:
      - wp_core:/var/www/html
      - ..:/var/www/html/wp-content/plugins/shouse

volumes:
  db_data:
  wp_core:
