name: shouse-ols

# OpenLiteSpeed + WordPress + WooCommerce for the LiteSpeed page cache module, with the repo mounted
# as the plugin like on the main dev site. OLS caches only what PHP marks with X-LiteSpeed-Cache-Control
# (checkPublicCache 1, enableCache 0), which is how the module works on LiteSpeed hosts.
# Setup: ./dev/ols/setup.sh    Site: http://localhost:8896 (credentials in build/dev-credentials.env)
# OLS listens on OLS_PORT inside the container too, so loopback works with isolated project ports.
# WP-CLI runs inside the ols container (dev/ols/wp.sh) with the same lsphp, which has PhpRedis.

x-db-env: &db-env
  MARIADB_DATABASE: wordpress
  MARIADB_USER: wordpress
  MARIADB_PASSWORD: ${SHOUSE_DEV_DB_PASSWORD:?Source dev/env.sh first}
  MARIADB_ROOT_PASSWORD: ${SHOUSE_DEV_DB_ROOT_PASSWORD:?Source dev/env.sh first}

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"] # keeps data across restarts, like many hosts: tests the stale-data guard

  db:
    image: mariadb:11.4
    environment: *db-env
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 30

  ols:
    image: litespeedtech/openlitespeed:1.9.2-lsphp83
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${OLS_PORT:-8896}:${OLS_PORT:-8896}"
    # The shared host UID can already exceed the image's low per-user PHP process limit.
    command: ["sh", "-c", "sed -i 's/^\\( *address *\\)\\*:80$/\\1*:${OLS_PORT:-8896}/' /usr/local/lsws/conf/httpd_config.conf && sed -i -E 's/(procSoftLimit|procHardLimit)([[:space:]]+)[0-9]+/\\1\\210000/' /usr/local/lsws/conf/httpd_config.conf && /usr/local/lsws/bin/lswsctrl restart"]
    volumes:
      - wp:/var/www/vhosts/localhost/html
      - ../../plugin:/var/www/vhosts/localhost/html/wp-content/plugins/shouse
      - ..:/tests:ro
      - ../../build/wp-cli.phar:/usr/local/bin/wp-cli.phar:ro

volumes:
  wp:
