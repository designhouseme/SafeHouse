name: shouse-updtest

# Isolated site installed from a release zip: self-update, uninstall and Plugin Check tests. No bind mount of the repo: an update replaces the
# plugin directory, which must never be the git working tree. "updates" plays the update host.
x-wp-env: &wp-env
  WORDPRESS_DB_HOST: db:3306
  WORDPRESS_DB_USER: wordpress
  WORDPRESS_DB_PASSWORD: wordpress
  WORDPRESS_DB_NAME: wordpress
  WORDPRESS_DEBUG: "1"
  WORDPRESS_CONFIG_EXTRA: |
    define( 'WP_DEBUG_LOG', '/var/www/html/wp-content/debug.log' );
    define( 'WP_DEBUG_DISPLAY', false );
    define( 'WP_ENVIRONMENT_TYPE', 'local' );
    define( 'SHOUSE_UPDATE_URL', 'http://updates/shouse/manifest.json' );
    define( 'SHOUSE_UPDATE_PUBLIC_KEYS', [ '${SHOUSE_TEST_PUBKEY:-}' ] );
    define( 'SHOUSE_ADVISORY_URL', 'http://updates/shouse/advisories/index.json' );
    define( 'SHOUSE_ADVISORY_PUBLIC_KEYS', [ '${SHOUSE_TEST_ADVISORY_PUBKEY:-}' ] );

services:
  updates:
    image: nginx:alpine
    volumes:
      - ../../build/updtest/www:/usr/share/nginx/html:ro

  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
      MARIADB_ROOT_PASSWORD: wordpress
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 30

  wordpress:
    image: wordpress:php8.3-apache
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8895:80"
    environment: *wp-env
    volumes:
      - wp_core:/var/www/html

  wpcli:
    image: wordpress:cli-php8.3
    profiles: ["cli"]
    user: "33:33"
    environment: *wp-env
    volumes:
      - wp_core:/var/www/html
      - ../../build/updtest/pkgs:/pkgs:ro

volumes:
  wp_core:
